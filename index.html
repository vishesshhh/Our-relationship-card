<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upma & Vishesh</title>

    <style>
        :root {
            --bg-env-start: #f1f5f9;
            --bg-env-via: #f3e8ff;
            --bg-env-end: #dbeafe;

            --color-pink: #FF3366;
            --color-pink-deep: #FF2A85;
            --color-purple-light: #C233D3;
            --color-purple: #8B2CDB;

            --card-bg: linear-gradient(
                135deg,
                var(--color-pink) 0%,
                var(--color-pink-deep) 40%,
                var(--color-purple-light) 65%,
                var(--color-purple) 100%
            );

            --font-sans: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco,
                Consolas, "Liberation Mono", "Courier New", monospace;

            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.85);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-env-start: #420f46;
                --bg-env-via: #3b0764;
                --bg-env-end: rgb(84, 22, 88);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(
                to bottom right,
                var(--bg-env-start),
                var(--bg-env-via),
                var(--bg-env-end)
            );

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        /* BACKGROUND ORBS */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(48px);
            z-index: 0;
        }

        .orb-1 {
            top: 5rem;
            left: 5rem;
            width: 24rem;
            height: 24rem;

            background-color: rgba(255, 51, 102, 0.15);

            animation: float-1 10s infinite ease-in-out;
        }

        .orb-2 {
            bottom: 5rem;
            right: 5rem;
            width: 24rem;
            height: 24rem;

            background-color: rgba(139, 44, 219, 0.15);

            animation: float-2 12s infinite ease-in-out;
        }

        /* CARD */

        .card-wrapper {
            position: relative;

            width: 100%;
            max-width: 380px;

            aspect-ratio: 10 / 14.5;

            perspective: 1500px;

            z-index: 10;

            padding: 1rem;

            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;

            position: relative;

            border-radius: 1.75rem;

            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);

            background: var(--card-bg);

            transform-style: preserve-3d;

            padding: 2.5rem 1.5rem;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: space-between;

            overflow: hidden;

            will-change: transform;

            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* GLARE */

        .glare {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(255, 255, 255, 0.5) 0%,
                    transparent 60%
                );

            opacity: 0;

            pointer-events: none;

            z-index: 3;

            mix-blend-mode: overlay;

            transition: opacity 0.3s ease;
        }

        .card-wrapper:hover .glare {
            opacity: 1;
        }

        /* SHIMMER */

        .shimmer-container {
            position: absolute;

            inset: 0;

            border-radius: 1.75rem;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }

        .shimmer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    to top right,
                    transparent 0%,
                    rgba(255,255,255,0.15) 50%,
                    transparent 100%
                );

            animation: shimmer 4s infinite linear;
        }

        /* CONTENT */

        .content-layer {
            position: relative;

            z-index: 4;

            height: 100%;
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            transform-style: preserve-3d;
        }

        /* CIRCULAR IMAGE */

        .circular-showcase {
            position: relative;

            width: 195px;
            height: 195px;

            margin-top: 0.5rem;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            transform: translateZ(65px);

            box-shadow:
                0 20px 40px rgba(0,0,0,0.4);

            will-change: transform;
        }

        .progress-ring {
            position: absolute;

            inset: -12px;

            width: calc(100% + 24px);
            height: calc(100% + 24px);

            pointer-events: none;

            transform: rotate(-90deg);
        }

        .progress-ring-circle-bg {
            fill: none;

            stroke: rgba(255, 255, 255, 0.15);

            stroke-width: 2;
        }

        .progress-ring-circle {
            fill: none;

            stroke: #ffffff;

            stroke-width: 5;

            stroke-linecap: round;

            stroke-dasharray: 600;

            stroke-dashoffset: 0;

            filter:
                drop-shadow(
                    0 0 10px rgba(255, 255, 255, 0.8)
                );

            animation:
                circleFill 1.5s ease-out forwards;
        }

        .circular-image-wrapper {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            padding: 4px;

            background: rgba(255,255,255,0.2);

            backdrop-filter: blur(4px);

            overflow: hidden;

            position: relative;
        }

        .circular-image-wrapper img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            border-radius: 50%;

            background-color:
                rgba(255, 255, 255, 0.1);
        }

        /* NAMES & DATE */

        .text-section {
            text-align: center;

            margin-top: 1.5rem;

            margin-bottom: auto;

            transform: translateZ(45px);

            will-change: transform;
        }

        .couple-names {
            font-size: 2.04rem;

            font-weight: 800;

            letter-spacing: 0.08em;

            text-shadow:
                0 4px 15px rgba(0,0,0,0.3);

            margin-bottom: 0.4rem;
        }

        .start-date {
            font-size: 1.05rem;

            font-weight: 500;

            color: var(--text-muted);

            letter-spacing: 0.05em;
        }

        /* COUNTER */

        .counter-container {
            width: 100%;

            transform: translateZ(55px);

            margin-bottom: 1.5rem;

            will-change: transform;
        }

        .counter-glass {
            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            border:
                1px solid rgba(255, 255, 255, 0.35);

            border-radius: 1.25rem;

            padding: 1.25rem 0.5rem;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .counter-item {
            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 2px;
        }

        .counter-divider {
            width: 1px;

            height: 28px;

            background:
                rgba(255, 255, 255, 0.25);

            border-radius: 1px;
        }

        .counter-num {
            font-family: var(--font-mono);

            font-size: 1.49rem;

            font-weight: 700;

            line-height: 1;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.2);

            letter-spacing: 1px;
        }

        .counter-unit {
            font-size: 0.61rem;

            text-transform: uppercase;

            letter-spacing: 0.15em;

            color:
                rgba(255, 255, 255, 0.8);

            font-weight: 600;

            margin-top: 6px;
        }

        /* ANIMATIONS */

        @keyframes float-1 {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -20px);
            }
        }

        @keyframes float-2 {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-40px, 20px);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;

                transform:
                    scale(0.9)
                    translateY(30px)
                    rotateX(10deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0)
                    rotateX(0deg);
            }
        }

        @keyframes circleFill {
            from {
                stroke-dashoffset: 600;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

    </style>
</head>

                            <span class="counter-unit">
                                Hours

                        <div class="counter-divider"></div>


                        <div class="counter-item">

                            <span

                            >
                                00
                            </span>

                            <span class="counter-unit">

                        <div class="counter-divider"></div>


                        <div class="counter-item">

                            <span

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
